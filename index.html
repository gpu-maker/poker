<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>'$'+n.toLocaleString();

/* ================= sound ================= */
let AC=null,muted=false;
function unlockAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
addEventListener('pointerdown',unlockAudio,{passive:true});addEventListener('keydown',unlockAudio);
function noiseSrc(dur){const b=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource();s.buffer=b;return s}
function tone(type,freq,start,dur,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.0005,start+dur);o.connect(g);g.connect(AC.destination);o.start(start);o.stop(start+dur+.02)}
function sfx(t){
  if(muted||!AC||AC.state!=='running')return;const now=AC.currentTime;
  if(t==='card'||t==='fold'){const s=noiseSrc(t==='card'?.07:.2),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type=t==='card'?'bandpass':'lowpass';f.frequency.value=t==='card'?2600:900;f.Q.value=.9;
    g.gain.setValueAtTime(t==='card'?.4:.22,now);g.gain.exponentialRampToValueAtTime(.001,now+(t==='card'?.08:.22));
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(now)}
  else if(t==='chip'){for(let k=0;k<3;k++)tone('triangle',2600+Math.random()*1600,now+k*.05+Math.random()*.015,.05,.1)}
  else if(t==='check'){tone('sine',170,now,.09,.5);tone('sine',170,now+.12,.09,.45)}
  else if(t==='turn'){tone('sine',988,now,.18,.08);tone('sine',1318,now+.09,.22,.07)}
  else if(t==='win'){[523,659,784,1047,1319].forEach((f,k)=>tone('triangle',f,now+k*.1,.55,.14))}
  else if(t==='lose'){[392,330,262].forEach((f,k)=>tone('sine',f,now+k*.14,.4,.1))}
}
const ICON_ON='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.7 1.3l-1.4-1.4L18 11.2l-2.3-2.3-1.4 1.4 2.3 2.3-2.3 2.3 1.4 1.4 2.3-2.3 2.3 2.3 1.4-1.4-2.3-2.3z"/></svg>';
$('#mute').innerHTML=ICON_ON;
$('#mute').onclick=()=>{muted=!muted;$('#mute').innerHTML=muted?ICON_OFF:ICON_ON};

/* ================= cards & evaluation ================= */
const SUITS=['s','h','d','c'],SYM={s:'♠',h:'♥',d:'♦',c:'♣'};
const RN={11:'J',12:'Q',13:'K',14:'A'};const rn=r=>RN[r]||String(r);
const FULL=[];for(let r=2;r<=14;r++)for(let k=0;k<4;k++)FULL.push({r,s:SUITS[k],id:r*4+k});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const COMB={};
function combos(n){if(COMB[n])return COMB[n];const out=[];const rec=(st,acc)=>{if(acc.length===5){out.push(acc.slice());return}
  for(let i=st;i<n;i++){acc.push(i);rec(i+1,acc);acc.pop()}};rec(0,[]);return COMB[n]=out}
function score5(cs){
  const r=[cs[0].r,cs[1].r,cs[2].r,cs[3].r,cs[4].r].sort((x,y)=>y-x);
  const s0=cs[0].s,fl=cs[1].s===s0&&cs[2].s===s0&&cs[3].s===s0&&cs[4].s===s0;
  const cnt={};for(const x of r)cnt[x]=(cnt[x]||0)+1;
  const g=Object.keys(cnt).map(k=>[cnt[k],+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  let sh=0;if(g.length===5){if(r[0]-r[4]===4)sh=r[0];else if(r[0]===14&&r[1]===5)sh=5}
  let cat,t;
  if(sh&&fl){cat=8;t=[sh]}
  else if(g[0][0]===4){cat=7;t=[g[0][1],g[1][1]]}
  else if(g[0][0]===3&&g[1][0]===2){cat=6;t=[g[0][1],g[1][1]]}
  else if(fl){cat=5;t=r}
  else if(sh){cat=4;t=[sh]}
  else if(g[0][0]===3){cat=3;t=g.map(x=>x[1])}
  else if(g[0][0]===2&&g[1][0]===2){cat=2;t=g.map(x=>x[1])}
  else if(g[0][0]===2){cat=1;t=g.map(x=>x[1])}
  else{cat=0;t=r}
  let s=cat;for(let i=0;i<5;i++)s=s*15+(t[i]||0);return s;
}
const CAT=['High Card','Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];
const PL={2:'Twos',3:'Threes',4:'Fours',5:'Fives',6:'Sixes',7:'Sevens',8:'Eights',9:'Nines',10:'Tens',11:'Jacks',12:'Queens',13:'Kings',14:'Aces'};
const catOf=s=>Math.floor(s/759375);
function handName(s){const cat=catOf(s),t1=Math.floor(s/50625)%15,t2=Math.floor(s/3375)%15;
  if(cat===8&&t1===14)return'Royal Flush';
  if(cat===1)return'Pair of '+PL[t1];
  if(cat===2)return PL[t1]+' & '+PL[t2];
  if(cat===3)return'Three '+PL[t1];
  if(cat===6)return PL[t1]+' full of '+PL[t2];
  if(cat===7)return'Four '+PL[t1];
  if(cat===0)return rn(t1)+' High';
  return CAT[cat];}
function bannerName(s){const cat=catOf(s);if(cat===8&&Math.floor(s/50625)%15===14)return'Royal Flush';return CAT[cat]}
function best(cards){let bs=-1,bc=null;for(const cb of combos(cards.length)){const h=cb.map(i=>cards[i]);const s=score5(h);if(s>bs){bs=s;bc=h}}
  return{score:bs,cards:bc,name:handName(bs)}}
function scoreBest(cards){let bs=-1;for(const cb of combos(cards.length)){const s=score5([cards[cb[0]],cards[cb[1]],cards[cb[2]],cards[cb[3]],cards[cb[4]]]);if(s>bs)bs=s}return bs}
function equity(hole,board,nOpp,iters){
  if(nOpp<=0)return 1;
  const used=new Set(hole.concat(board).map(c=>c.id));
  const deck=FULL.filter(c=>!used.has(c.id));const need=5-board.length,n=need+2*nOpp;let win=0;
  for(let t=0;t<iters;t++){
    for(let k=0;k<n;k++){const j=k+Math.floor(Math.random()*(deck.length-k));const tmp=deck[k];deck[k]=deck[j];deck[j]=tmp}
    const b=board.concat(deck.slice(0,need));const my=scoreBest(hole.concat(b));let lose=false,ties=0;
    for(let o=0;o<nOpp;o++){const s=scoreBest([deck[need+2*o],deck[need+2*o+1]].concat(b));if(s>my){lose=true;break}if(s===my)ties++}
    if(!lose)win+=ties?1/(ties+1):1;
  }
  return win/iters;
}

/* ================= card art ================= */
const PIPS={
  2:[[50,20],[50,80]],
  3:[[50,20],[50,50],[50,80]],
  4:[[33,20],[67,20],[33,80],[67,80]],
  5:[[33,20],[67,20],[50,50],[33,80],[67,80]],
  6:[[33,20],[67,20],[33,50],[67,50],[33,80],[67,80]],
  7:[[33,20],[67,20],[50,35],[33,50],[67,50],[33,80],[67,80]],
  8:[[33,20],[67,20],[50,35],[33,50],[67,50],[50,65],[33,80],[67,80]],
  9:[[33,20],[67,20],[33,40],[67,40],[50,50],[33,60],[67,60],[33,80],[67,80]],
  10:[[33,20],[67,20],[50,30],[33,40],[67,40],[33,60],[67,60],[50,70],[33,80],[67,80]],
};
function figure(r,red){
  const robe=red?'#c8102e':'#1f3a8a',gold='#e8b84a',skin='#f6d6b4',dk='#7a5a1c';
  const hair=r===13?'#ece7dc':r===12?'#c98a2c':'#6b3d1e';
  let s='<svg viewBox="0 0 40 34" preserveAspectRatio="xMidYMax meet">';
  if(r===13)s+=`<path d="M33 34L36 9.5" stroke="${gold}" stroke-width="1.7"/><circle cx="36.2" cy="8" r="2.5" fill="${gold}" stroke="${dk}" stroke-width=".6"/><path d="M36.2 4.2v1.6M35.4 5h1.6" stroke="${dk}" stroke-width=".7"/>`;
  if(r===11)s+=`<path d="M34 34L37 7" stroke="#9aa3ad" stroke-width="1.5"/><path d="M37.2 7.2l-1.8-5 3.6.3z" fill="#dfe5ea" stroke="#7d868f" stroke-width=".4"/><path d="M33.3 14l5.4.7" stroke="${gold}" stroke-width="1.5" stroke-linecap="round"/>`;
  if(r===12)s+=`<path d="M13 15Q12 5 20 4.5Q28 5 27 15L29 27Q25 25 24.5 17L15.5 17Q15 25 11 27Z" fill="${hair}"/>`;
  s+=`<path d="M2 34C3 25 11 21 20 21C29 21 37 25 38 34Z" fill="${robe}"/>`;
  s+=`<path d="M2 34C3 25 11 21 20 21C29 21 37 25 38 34" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".6"/>`;
  s+=`<path d="M7.5 34C8.5 28 12.5 25 16.5 24M32.5 34C31.5 28 27.5 25 23.5 24M20 26V34" stroke="${gold}" stroke-width="1" fill="none"/>`;
  s+=`<g fill="${gold}"><circle cx="9.5" cy="31" r=".8"/><circle cx="30.5" cy="31" r=".8"/><circle cx="12.5" cy="28" r=".7"/><circle cx="27.5" cy="28" r=".7"/><circle cx="20" cy="29" r=".9"/><circle cx="20" cy="32" r=".9"/></g>`;
  s+=`<path d="M12.5 22.6Q20 29.5 27.5 22.6L25.2 20.8Q20 25 14.8 20.8Z" fill="#fff" stroke="${gold}" stroke-width=".6"/>`;
  s+=`<rect x="18" y="17" width="4" height="5" fill="#e3b892"/><ellipse cx="20" cy="13.5" rx="5" ry="6" fill="${skin}"/>`;
  s+=`<path d="M17.2 12.2q.9-.6 1.8 0M21 12.2q.9-.6 1.8 0" stroke="#5a3a28" stroke-width=".45" fill="none"/><circle cx="18.1" cy="13.2" r=".6" fill="#2a1a12"/><circle cx="21.9" cy="13.2" r=".6" fill="#2a1a12"/><path d="M20 13.6l-.5 2h1" stroke="#c99a78" stroke-width=".45" fill="none"/>`;
  if(r===13)s+=`<path d="M15 14.5Q15.3 22.8 20 23.8Q24.7 22.8 25 14.5Q23 17.6 20 17.7Q17 17.6 15 14.5Z" fill="${hair}"/><path d="M17.6 17.4q2.4-1.2 4.8 0" stroke="#c9c2b2" stroke-width=".7" fill="none"/><path d="M17 19.5q3 2 6 0M18 21.5q2 1.2 4 0" stroke="#d6d0c2" stroke-width=".4" fill="none"/>`;
  else s+=`<path d="M18.6 17.1q1.4.9 2.8 0" stroke="#b5524a" stroke-width=".65" fill="none"/>`;
  if(r===11)s+=`<path d="M17.9 16.1q2.1-1 4.2 0" stroke="${hair}" stroke-width=".9" fill="none"/><path d="M15 12Q15.5 7 20 7Q24.5 7 25 12Q22 9.5 20 10Q18 9.5 15 12Z" fill="${hair}"/>`;
  if(r===12)s+=`<path d="M15 12Q16 6.5 20 6.8Q24 6.5 25 12Q22.5 9 20 9.2Q17.5 9 15 12Z" fill="${hair}"/><circle cx="16.8" cy="15.2" r=".95" fill="#ff8a8a" opacity=".4"/><circle cx="23.2" cy="15.2" r=".95" fill="#ff8a8a" opacity=".4"/><circle cx="14.8" cy="15.5" r=".7" fill="${gold}"/><circle cx="25.2" cy="15.5" r=".7" fill="${gold}"/>`;
  if(r===13)s+=`<path d="M15 11Q15 7.5 20 7.5Q25 7.5 25 11Q22 9.6 20 9.8Q18 9.6 15 11Z" fill="${hair}"/>`;
  if(r===13)s+=`<path d="M14.6 8.6L14 2.2L16.8 4.9L20 1L23.2 4.9L26 2.2L25.4 8.6Z" fill="${gold}" stroke="${dk}" stroke-width=".5" stroke-linejoin="round"/><path d="M14.6 7.4h10.8" stroke="${dk}" stroke-width=".5"/><circle cx="20" cy="5.8" r=".95" fill="${robe}"/><circle cx="16.7" cy="6.6" r=".6" fill="#fff"/><circle cx="23.3" cy="6.6" r=".6" fill="#fff"/><circle cx="20" cy="1" r=".6" fill="${gold}"/>`;
  if(r===12)s+=`<path d="M15.4 7.6Q20 .8 24.6 7.6Q20 6 15.4 7.6Z" fill="${gold}" stroke="${dk}" stroke-width=".5"/><circle cx="20" cy="4.3" r="1" fill="${robe}"/><circle cx="17.6" cy="6" r=".45" fill="#fff"/><circle cx="22.4" cy="6" r=".45" fill="#fff"/>`;
  if(r===11)s+=`<path d="M14 9.6Q14 3.4 20.5 3.4Q26.6 3.9 26.6 9.6Z" fill="${robe}" stroke="${gold}" stroke-width=".7"/><path d="M14 9.6h12.6" stroke="${gold}" stroke-width="1"/><path d="M24 4.6Q29.5-.2 35 1.4Q30.5 3.2 26.2 7.2Z" fill="${gold}" stroke="${dk}" stroke-width=".4"/><path d="M26 6Q30 2.6 34 1.8" stroke="${dk}" stroke-width=".35" fill="none"/>`;
  if(r===12)s+=`<path d="M6.6 34L6 21" stroke="#2f7d3a" stroke-width="1"/><path d="M6.3 27q-2.6-1.2-3.2-3.2q2.4.2 3.2 3.2z" fill="#3c9a48"/><g fill="#f08aa0" stroke="#b5405a" stroke-width=".3"><circle cx="6" cy="17.6" r="1.6"/><circle cx="4.3" cy="19.1" r="1.4"/><circle cx="7.7" cy="19.1" r="1.4"/><circle cx="5" cy="20.8" r="1.3"/><circle cx="7" cy="20.8" r="1.3"/></g><circle cx="6" cy="19.3" r=".9" fill="${gold}"/>`;

}
const anim=new Set();
function faceHTML(c,extra=''){
  const red=c.s==='h'||c.s==='d',R=rn(c.r),S=SYM[c.s];
  let body='',t='';
  if(c.r<=10){body='<div class="pips">'+PIPS[c.r].map(([x,y])=>`<span class="pip${y>50?' flip':''}" style="left:${x}%;top:${y}%">${S}</span>`).join('')+'</div>'}
  else if(c.r<=13){const f=figure(c.r,red);
    body=`<div class="court"><div class="half top"><span class="cs">${S}</span>${f}</div><div class="half bot"><span class="cs">${S}</span>${f}</div></div>`}
  else{t=' ace'+(c.s==='s'?' spade':'');body=(c.s==='s'?'<div class="ring"></div>':'')+`<div class="big">${S}</div>`}
  return`<div class="card${red?' red':''}${t}${extra}"><div class="crn tl${c.r===10?' ten':''}">${R}<i>${S}</i></div>${body}<div class="crn br${c.r===10?' ten':''}">${R}<i>${S}</i></div></div>`;
}
const backHTML=extra=>`<div class="card back${extra}"><div class="medal">♠</div></div>`;
function cardHTML(c,key,faceUp){
  const kb=key+'b',kf=key+'f',board=key[0]==='b';
  if(!faceUp){let a='';if(!anim.has(kb)){anim.add(kb);a=' anim-deal'}return backHTML(a)}
  let ex='';if(G.winCards)ex+=G.winCards.has(c.id)?' win':' dim';
  if(board||anim.has(kb)){
    let a='';if(!anim.has(kf)){anim.add(kf);a=board?' anim-board':' anim-flip'}
    return`<div class="card flipwrap${a}${ex}">${backHTML('')}${faceHTML(c,'')}</div>`;
  }
  if(!anim.has(kf)){anim.add(kf);ex+=' anim-deal'}
  return faceHTML(c,ex);
}

/* ================= avatars ================= */

function chipsHTML(amt,maxStacks=3){

/* ================= hand-range model ================= */
function chen(a,b){const hi=Math.max(a.r,b.r),lo=Math.min(a.r,b.r);const pts=r=>r===14?10:r===13?8:r===12?7:r===11?6:r/2;
  let s=pts(hi);if(hi===lo)s=Math.max(5,s*2);if(a.s===b.s)s+=2;
  if(hi!==lo){const gap=hi-lo-1;s-=gap<=0?0:gap===1?1:gap===2?2:gap===3?4:5;if(gap<=1&&hi<12)s+=1}
  return Math.ceil(s)}
const PCT={};
(()=>{const all=[];for(let i=0;i<52;i++)for(let j=i+1;j<52;j++)all.push(chen(FULL[i],FULL[j]));
  all.sort((x,y)=>x-y);const first={},last={};all.forEach((v,i)=>{if(first[v]===undefined)first[v]=i;last[v]=i});
  for(const v in first)PCT[v]=((first[v]+last[v])/2)/all.length})();
const pct2=(a,b)=>PCT[chen(a,b)];
// equity vs opponents whose hands are drawn from the top (1-th) of all starting hands
function equityR(hole,board,ths,iters){
  if(!ths.length)return 1;
  const used=new Set(hole.concat(board).map(c=>c.id));
  const D=FULL.filter(c=>!used.has(c.id)),L=D.length,need=5-board.length;let win=0;
  for(let t=0;t<iters;t++){
    let k=0;const draw=()=>{const j=k+Math.floor(Math.random()*(L-k));const tmp=D[k];D[k]=D[j];D[j]=tmp;return D[k++]};
    const opp=[];
    for(const th of ths){let a,b,tries=0;
      do{if(tries)k-=2;a=draw();b=draw();tries++}while(th>0&&tries<12&&pct2(a,b)<th);
      opp.push(a,b)}
    const bd=board.slice();for(let i=0;i<need;i++)bd.push(draw());
    const my=scoreBest(hole.concat(bd));let lose=false,ties=0;
    for(let o=0;o<ths.length;o++){const s=scoreBest([opp[2*o],opp[2*o+1]].concat(bd));if(s>my){lose=true;break}if(s===my)ties++}
    if(!lose)win+=ties?1/(ties+1):1;
  }
  return win/iters;
}
function drawInfo(hand,board){
  const cs=hand.concat(board);let best=0;
  for(const s of SUITS){const n=cs.filter(c=>c.s===s).length;if(n===4&&hand.some(c=>c.s===s))best=2}
  const rs=new Set(cs.map(c=>c.r));if(rs.has(14))rs.add(1);
  for(let lo=1;lo<=10;lo++){let have=0,miss=-1;for(let r=lo;r<lo+5;r++){if(rs.has(r))have++;else miss=r}
    if(have===4&&hand.some(c=>c.r>=lo&&c.r<lo+5||(c.r===14&&lo===1))){best=Math.max(best,(miss===lo||miss===lo+4)?2:1)}}
  return best;
}

function geom(){const st=$('#stage').getBoundingClientRect();return{portrait:st.height>st.width*1.05}}
function railGeom(){
  const st=$('#stage').getBoundingClientRect(),rm=$('.rim').getBoundingClientRect(),wd=$('.wood').getBoundingClientRect();
  return{W:st.width,H:st.height,cx:rm.left-st.left+rm.width/2,cy:rm.top-st.top+rm.height/2,hw:rm.width/2,hh:rm.height/2,rail:wd.left-rm.left};
}
// distance from table centre to the outer edge of the pill-shaped rail along an angle
function edge(g,ang){
  const dx=Math.cos(ang),dy=Math.sin(ang),horiz=g.hw>=g.hh,r=horiz?g.hh:g.hw,a=Math.abs(g.hw-g.hh);
  const dist=t=>{const x=Math.abs(t*dx),y=Math.abs(t*dy);return horiz?Math.hypot(Math.max(x-a,0),y):Math.hypot(x,Math.max(y-a,0))};
  let lo=0,hi=Math.max(g.hw,g.hh)*1.6;for(let k=0;k<32;k++){const m=(lo+hi)/2;if(dist(m)<r)lo=m;else hi=m}return lo;
}
const tpt=(g,ang,k,off=0)=>{const e=edge(g,ang)*k+off;return{x:g.cx+Math.cos(ang)*e,y:g.cy+Math.sin(ang)*e}};
function layout(){
  const{portrait}=geom();
  document.body.classList.toggle('portrait',portrait);
  const g=railGeom();
  for(let i=0;i<SEATS;i++){
    const a=(90+i*60)*Math.PI/180,el=seatEls[i];
    const p=tpt(g,a,1,portrait?-g.rail*.4:-g.rail*.2);
    if(i===0){p.x=g.cx;p.y=g.H*(portrait?.86:.83)}
    const hx=(el.offsetWidth||112)/2+4,hy=(el.offsetHeight||90)/2+2;
    p.x=Math.min(Math.max(p.x,hx),g.W-hx);p.y=Math.min(Math.max(p.y,hy),g.H-hy);
    el.style.left=p.x+'px';el.style.top=p.y+'px';
    const b=tpt(g,a,i===0?.56:.62);if(i===3)b.y=Math.max(b.y,p.y+hy+30);if(portrait&&i!==0&&i!==3){const dir=Math.sign(g.cx-p.x)||1;b.x=p.x+dir*(hx+34);b.y=p.y+(g.cy-p.y)*.12+12}betEls[i].style.left=b.x+'px';betEls[i].style.top=b.y+'px';
  }
  cupEls.forEach((c,k)=>{const p=tpt(g,k*60*Math.PI/180,1,-g.rail*.5);c.style.left=p.x+'px';c.style.top=p.y+'px'});
  placeDealer();
}

}

async function startHand(){

  P.forEach(p=>{if(p.chips<=0)p.out=true});
  if(P[0].out)return gameOver(false);
  if(P.filter(p=>!p.out).length===1)return gameOver(true);
  G.hand++;G.msg='';G.hideD=false;
  if(+G.set.level>0&&G.hand>1&&(G.hand-1)%G.set.level===0){G.sb*=2;G.bb*=2;G.lv++;G.msg=`Level ${G.lv} — blinds now ${fmt(G.sb)} / ${fmt(G.bb)}`;
    showBanner('Level '+G.lv,`Blinds ${fmt(G.sb)} / ${fmt(G.bb)}`)}
  P.forEach(p=>Object.assign(p,{hand:[],folded:p.out,allIn:false,bet:0,total:0,acted:false,lastAction:'',showCards:false,handName:'',winner:false,won:0,
    rangeT:0,eqPct:null,vol:false,pfr:false,lastEq:null,score:undefined,best:null}));
  anim.clear();G.board=[];G.deck=shuffle(FULL);G.winCards=null;G.turn=-1;G.seen=false;G.oddsKey='';G.street=0;G.pfRaiser=-1;G.pre=null;G.log=[];
  G.stats.hands++;G.hm.hands++;
  G.dealer=nextAlive(G.dealer);placeDealer();
  const alive=P.filter(p=>!p.out).length;
  const sbI=alive===2?G.dealer:nextAlive(G.dealer),bbI=nextAlive(sbI);
  lg(`Hand #${G.hand} · ${P[G.dealer].name} on the button`);
  put(P[sbI],G.sb);P[sbI].lastAction='SB';put(P[bbI],G.bb);P[bbI].lastAction='BB';
  lg(`${P[sbI].name} posts SB ${fmt(P[sbI].bet)} · ${P[bbI].name} posts BB ${fmt(P[bbI].bet)}`);
  G.currentBet=G.bb;G.minRaise=G.bb;G.raises=0;
  render();sfx('chip');await wait(400);
  for(let r=0;r<2;r++)for(let k=1;k<=SEATS;k++){const i=(G.dealer+k)%SEATS;if(!P[i].out){P[i].hand.push(G.deck.pop());render();sfx('card');await wait(95)}}
  await wait(350);
  G.seen=true;render();sfx('card');lg(`You hold ${P[0].hand.map(cs).join(' ')}`);await wait(650);
  await bettingRound((bbI+1)%SEATS);
  const names=['Flop','Turn','River'];
  for(let si=0;si<3;si++){
    if(notFolded().length<=1)break;
    await collectBets();
    P.forEach(p=>{p.acted=false;if(p.lastAction!=='Fold'&&p.lastAction!=='All-in')p.lastAction=''});
    G.currentBet=0;G.minRaise=G.bb;G.raises=0;G.street=si+1;G.pre=null;
    const actors=P.filter(canAct).length;
    if(actors<2){

      runoutEq();render();await wait(900);
    }
    G.deck.pop();
    const n=si===0?3:1;
    for(let k=0;k<n;k++){G.board.push(G.deck.pop());render();sfx('card');await wait(200)}
    lg(`— ${names[si]}: ${G.board.map(cs).join(' ')}`);
    await wait(400);
    if(actors>=2)await bettingRound((G.dealer+1)%SEATS);else{runoutEq();render();await wait(900)}

  P.forEach(p=>p.eqPct=null);
  await collectBets();

  G.lastLog=G.log.slice();
  P.forEach(p=>{if(p.chips<=0&&!p.empty)p.out=true});
  if(!P[0].out&&P.filter(p=>!p.out).length>1)saveGame();else clearSave();
  showNext(true);
}
function runoutEq(){
  const cont=notFolded(),need=5-G.board.length;
  if(need<=0||cont.length<2){cont.forEach(p=>p.eqPct=null);return}
  const used=new Set(G.board.map(c=>c.id));cont.forEach(p=>p.hand.forEach(c=>used.add(c.id)));
  const D=FULL.filter(c=>!used.has(c.id)),wins=cont.map(()=>0),N=need===1?D.length:1000;
  for(let t=0;t<N;t++){let b;
    if(need===1)b=G.board.concat([D[t]]);
    else{for(let k=0;k<need;k++){const j=k+Math.floor(Math.random()*(D.length-k));const tmp=D[k];D[k]=D[j];D[j]=tmp}b=G.board.concat(D.slice(0,need))}
    const sc=cont.map(p=>scoreBest(p.hand.concat(b))),mx=Math.max(...sc),ws=sc.filter(s=>s===mx).length;
    sc.forEach((s,i)=>{if(s===mx)wins[i]+=1/ws})}
  cont.forEach((p,i)=>p.eqPct=Math.round(wins[i]/N*100));
}

async function bettingRound(start){
  let i=start,guard=0;
  while(guard++<500){
    if(notFolded().length<=1)return;
    const actors=P.filter(canAct);
    const pending=actors.filter(p=>!p.acted||p.bet<G.currentBet);
    if(!pending.length)return;
    if(actors.length===1&&actors[0].bet>=G.currentBet)return;
    const p=P[i];
    if(canAct(p)&&(!p.acted||p.bet<G.currentBet)){
      G.turn=i;render();
      const a=p.isHuman?await humanTurn(p):await botTurn(p);
      apply(p,a);G.turn=-1;render();await wait(p.isHuman?120:220);
    }
    i=(i+1)%SEATS;
  }
}

function rangeMul(p){
  if(!p.isHuman||G.diff!=='hard')return 1;
  const af=(G.hm.aggr+1)/(G.hm.pass+2),vp=G.hm.hands>4?G.hm.vpip/G.hm.hands:.3;let m=1;
  if(af>1.4)m*=.6;else if(af<.5)m*=1.25;
  if(vp<.2)m*=1.2;else if(vp>.5)m*=.7;
  return m;
}
function bumpRange(p,kind){
  const m=rangeMul(p);let t=p.rangeT;
  if(G.street===0){
    if(kind==='call')t=Math.max(t,.25*m);
    else if(kind==='allin')t=Math.max(t,Math.min(.9,.74*m));
    else t=Math.max(t,Math.min(.93,(G.raises>=2?.86:.64)*m));
  }else t+=kind==='call'?.03*m:.08*m;
  p.rangeT=Math.min(.94,t);
}
function apply(p,a){
  const toCall=G.currentBet-p.bet,pre=G.street===0;
  if(a.type==='fold'){p.folded=true;p.lastAction='Fold';G.msg=`${p.name} ${p.isHuman?'fold':'folds'}`;sfx('fold');lg(`${p.name} folds`)}
  else if(a.type==='check'||(a.type==='call'&&toCall<=0)){p.lastAction='Check';G.msg=`${p.name} ${p.isHuman?'check':'checks'}`;sfx('check');lg(`${p.name} checks`);
    if(p.isHuman&&!pre)G.hm.pass++}
  else if(a.type==='call'){put(p,toCall);p.lastAction=p.allIn?'All-in':'Call';G.msg=`${p.name} ${p.isHuman?'call':'calls'}${p.allIn?' all-in':' '+fmt(p.bet)}`;sfx('chip');
    lg(`${p.name} calls ${fmt(p.bet)}${p.allIn?' (all-in)':''}`);bumpRange(p,p.allIn?'allin':'call');
    if(p.isHuman){if(pre&&!p.vol){p.vol=true;G.stats.vpip++;G.hm.vpip++}if(!pre)G.hm.pass++}}
  else if(a.type==='raise'){
    const to=Math.min(Math.max(a.to,G.currentBet+G.minRaise),p.bet+p.chips),prev=G.currentBet;
    put(p,to-p.bet);sfx('chip');
    if(p.bet>prev){
      const inc=p.bet-prev;if(inc>=G.minRaise)G.minRaise=inc;G.currentBet=p.bet;G.raises++;
      P.forEach(q=>{if(q!==p)q.acted=false});
      if(pre)G.pfRaiser=p.id;
      p.lastAction=p.allIn?'All-in':(prev===0?'Bet ':'Raise ')+fmt(p.bet);
      G.msg=p.allIn?`${p.name} ${p.isHuman?'go':'goes'} ALL-IN for ${fmt(p.bet)}!`:`${p.name} ${prev===0?(p.isHuman?'bet':'bets'):(p.isHuman?'raise to':'raises to')} ${fmt(p.bet)}`;
      lg(p.allIn?`${p.name} is ALL-IN for ${fmt(p.bet)}`:`${p.name} ${prev===0?'bets':'raises to'} ${fmt(p.bet)}`);
      bumpRange(p,p.allIn?'allin':'raise');if(p.allIn)say(p,'allin',.35);
      if(p.isHuman){if(pre){if(!p.vol){p.vol=true;G.stats.vpip++;G.hm.vpip++}if(!p.pfr){p.pfr=true;G.stats.pfr++}}else G.hm.aggr++}
    }else{p.lastAction=p.allIn?'All-in':'Call';G.msg=`${p.name} ${p.isHuman?'call':'calls'}`;lg(`${p.name} calls ${fmt(p.bet)}`);bumpRange(p,'call')}
  }
  p.acted=true;
}

/* ================= AI ================= */
const DIFF={
  easy:{noise:.14,range:false,bluff:.5,loose:.07,iters:170,smart:false},
  normal:{noise:.05,range:true,bluff:1,loose:0,iters:280,smart:false},
  hard:{noise:.015,range:true,bluff:1.25,loose:-.01,iters:400,smart:true},
};
function actsAfter(p){let n=0;for(let k=1;k<SEATS;k++){const j=(p.id+k)%SEATS;if(canAct(P[j]))n++;if(j===G.dealer)break}return n}
async function botTurn(p){
  const fast=P[0].folded||P[0].out;
  await wait((fast?320:620)+Math.random()*(fast?280:700));
  const D=DIFF[G.diff]||DIFF.normal,smart=D.smart;
  const toCall=G.currentBet-p.bet,pot=potTotal(),st=p.st;
  const opps=P.filter(q=>q!==p&&!q.folded&&!q.out),n=opps.length;
  let eq=equityR(p.hand,G.board,opps.map(q=>D.range?q.rangeT:0),Math.min(D.iters,Math.round(D.iters*4/(n+1))));
  eq=Math.max(0,Math.min(1,eq+(Math.random()*2-1)*D.noise));p.lastEq=eq;
  const rel=eq*(n+1),r=Math.random(),odds=toCall/(pot+toCall);
  const canRaise=p.chips>toCall&&G.raises<4;
  const draw=(G.street===1||G.street===2)?drawInfo(p.hand,G.board):0;
  const late=actsAfter(p)<=1;
  const aggr=st.aggr+(smart&&late?.12:0);
  const bluff=st.bluff*D.bluff*(late?1.4:1)*(n<=2?1.5:.7);
  const sizeTo=f=>G.currentBet+Math.max(G.minRaise,Math.round((pot+toCall)*f/G.sb)*G.sb);
  const tooBig=to=>(to-p.bet)>p.chips*.6&&eq<.72&&rel<2.4;
  const strong=rel>1.55+(1-aggr)*.45||eq>.7,monster=eq>.85;
  if(toCall<=0){
    if(smart&&monster&&G.street>0&&G.street<3&&r<.3)return{type:'check'};             // slowplay
    if(canRaise&&G.street===1&&G.pfRaiser===p.id&&n<=2&&r<(smart?.7:.5))return{type:'raise',to:sizeTo(.45+Math.random()*.25)}; // c-bet
    if(canRaise&&strong&&r<.85){const f=monster&&G.street===3&&r<.3?1.6:(.5+Math.random()*.5);const to=sizeTo(f);if(!tooBig(to)||monster)return{type:'raise',to}}
    if(smart&&canRaise&&draw===2&&r<.45)return{type:'raise',to:sizeTo(.55)};          // semi-bluff
    if(canRaise&&r<bluff){const to=sizeTo(.5+Math.random()*.3);if(!tooBig(to))return{type:'raise',to}}
    return{type:'check'};
  }
  if(canRaise&&(rel>2.1-aggr*.45||eq>.75)&&r<.5+aggr*.35){
    if(smart&&monster&&G.street>0&&G.street<3&&r<.35)return{type:'call'};              // trap
    const to=sizeTo(.65+Math.random()*.6);if(!tooBig(to)||eq>.75)return{type:'raise',to}}
  if(smart&&canRaise&&draw===2&&G.street<3&&r<.2){const to=sizeTo(.7);if(!tooBig(to))return{type:'raise',to}}
  const need=odds*(draw===2?.72:draw===1?.9:1.04);
  const committed=toCall>p.chips*.5;
  if(eq+st.loose+D.loose>=need&&!(committed&&eq<.45&&rel<1.6))return{type:'call'};
  if(toCall<=G.bb&&G.street===0&&rel>.8)return{type:'call'};
  if(canRaise&&G.street<3&&r<bluff*.4){const to=sizeTo(.75);if(!tooBig(to))return{type:'raise',to}}
  return{type:'fold'};
}

function coachAdvice(p){
  const toCall=G.currentBet-p.bet,pot=potTotal(),opps=P.filter(q=>q!==p&&!q.folded&&!q.out);
  const eq=equityR(p.hand,G.board,opps.map(q=>q.rangeT),Math.min(600,Math.round(2000/(opps.length+1))));
  const odds=toCall>0?toCall/(pot+toCall):0,draw=(G.street===1||G.street===2)?drawInfo(p.hand,G.board):0;
  let a;
  if(toCall<=0)a=eq>.6?'Bet for value':(draw===2?'Semi-bluff or check':'Check');
  else if(eq>odds+.2&&eq>.55)a='Raise';
  else if(eq>=odds)a='Call';
  else if(draw===2&&eq>=odds*.72&&G.street<3)a='Call (drawing)';
  else a='Fold';
  return`💡 ${a} · ${Math.round(eq*100)}% equity`+(toCall>0?` · need ${Math.round(odds*100)}%`:'');
}
function humanTurn(p){
  const toCall=G.currentBet-p.bet;
  if(G.pre){const pre=G.pre;let act=null;
    if(pre==='cf')act=toCall>0?{type:'fold'}:{type:'check'};
    else if(pre==='ck'&&toCall<=0)act={type:'check'};
    else if(pre==='ca')act={type:'call'};
    G.pre=null;
    if(act)return wait(260).then(()=>act);
  }
  sfx('turn');
  return new Promise(res=>{G.resolveHuman=a=>{G.resolveHuman=null;setControls(null);res(a)};setControls(p);updateControls()});
}

async function showdown(){

  cont.forEach(p=>{p.showCards=true;const b=best(p.hand.concat(G.board));p.score=b.score;p.best=b.cards;p.handName=b.name;lg(`${p.name} shows ${p.hand.map(cs).join(' ')} — ${b.name}`)});
  G.msg='Showdown!';render();sfx('card');await wait(1200);
  const levels=[...new Set(P.filter(p=>p.total>0).map(p=>p.total))].sort((a,b)=>a-b);
  let prev=0,carry=0;const pots=[];
  for(const lv of levels){let amt=0;P.forEach(p=>amt+=Math.max(0,Math.min(p.total,lv)-prev));
    const el=cont.filter(p=>p.total>=lv);
    if(!el.length)carry+=amt;else{pots.push({amt:amt+carry,el});carry=0}prev=lv}
  if(carry&&pots.length)pots[pots.length-1].amt+=carry;
  const winSet=new Set();let mainWinners=[];
  pots.forEach(pt=>{
    const top=Math.max(...pt.el.map(p=>p.score));
    const ws=pt.el.filter(p=>p.score===top).sort((a,b)=>((a.id-G.dealer+SEATS-1)%SEATS)-((b.id-G.dealer+SEATS-1)%SEATS));
    const share=Math.floor(pt.amt/ws.length);let rem=pt.amt-share*ws.length;

  });

  const potSize=potTotal();

  G.winCards=winSet;

    if(mainWinners.some(w=>w.isHuman)){sfx('win');confetti(catOf(w0.score)>=4?110:70)}

  }

  if(el._v===undefined||el._v===val){cancelAnimationFrame(el._raf);el._v=val;el._shown=val;el.textContent=fmt(val);return}
  const from=el._shown,start=performance.now();el._v=val;cancelAnimationFrame(el._raf);
  const step=t=>{const k=Math.min(1,(t-start)/550),e=1-Math.pow(1-k,3),v=Math.round(from+(val-from)*e);el._shown=v;el.textContent=fmt(v);if(k<1)el._raf=requestAnimationFrame(step)};
  el._raf=requestAnimationFrame(step);
}
function updateOdds(){
  const me=P[0],od=$('#odds');

  if(!live){od.classList.add('off');return}
  const opps=P.filter(q=>q!==me&&!q.folded&&!q.out);
  const key=G.hand+'-'+G.board.length+'-'+opps.length+'-'+opps.map(q=>q.rangeT.toFixed(2)).join();
  if(G.oddsKey!==key){G.oddsKey=key;
    G.odds=opps.every(q=>q.showCards)&&G.board.length<5&&me.eqPct!=null?me.eqPct/100:equityR(me.hand,G.board,opps.map(q=>q.rangeT),Math.min(700,Math.round(2400/(opps.length+1))))}
  const pct=me.eqPct!=null?me.eqPct:Math.round(G.odds*100);

function newShoe(){
  const n=+B.set.decks||6;let s=[];for(let k=0;k<n;k++)s=s.concat(FULL.map(c=>({r:c.r,s:c.s,id:c.id})));

function bjToBet(){

async function bjRound(){
  if(!B||B.phase!=='bet'||B.bet<5||B.bet>B.balance)return;
  unlockAudio();
  B.phase='deal';B.round++;B.lastBet=B.bet;B.roundStart=B.balance;B.balance-=B.bet;
  B.hands=[{cards:[],bet:B.bet}];B.bet=0;B.dealer=[];B.holeUp=false;B.insurance=0;B.msg='';B.active=0;bjAnim.clear();
  B.log=[`Round #${B.round} · bet ${fmtB(B.lastBet)}`];B.stats.hands++;
  bjRender();sfx('chip');await bw(250);
  const h0=B.hands[0];
  h0.cards.push(draw());bjRender();sfx('card');await bw(340);
  B.dealer.push(draw());bjRender();sfx('card');await bw(340);
  h0.cards.push(draw());bjRender();sfx('card');await bw(340);
  B.dealer.push(draw(false));bjRender();sfx('card');await bw(480);
  B.log.push(`You: ${h0.cards.map(cs).join(' ')} · Dealer shows ${cs(B.dealer[0])}`);
  const up=B.dealer[0],dealerBJ=isBJ(B.dealer),playerBJ=isBJ(h0.cards);
  if(up.r===14&&!playerBJ&&B.balance>=h0.bet/2){
    B.phase='insurance';B.msg='Insurance?';
    const yes=await new Promise(r=>{B.resolve=r;bjRender()});
    if(yes==='yes'){B.insurance=h0.bet/2;B.balance-=B.insurance;sfx('chip');B.log.push(`You take insurance (${fmtB(B.insurance)})`)}else B.log.push('You decline insurance');
  }
  if(up.r===14||cval(up)===10){
    B.phase='peek';B.msg='Dealer checks for blackjack…';bjRender();await bw(900);
    if(dealerBJ){
      await revealHole();B.log.push('Dealer has blackjack');
      if(B.insurance){B.balance+=B.insurance*3;B.log.push(`Insurance pays ${fmtB(B.insurance*2)}`)}
      if(playerBJ){h0.result='push';B.balance+=h0.bet}else h0.result='lose';
      return bjFinish(true);
    }
    B.msg=B.insurance?'No blackjack — insurance lost':'No dealer blackjack';if(B.insurance)B.log.push('Insurance lost');bjRender();await bw(600);B.msg='';
  }
  if(playerBJ){await revealHole();h0.result='bj';B.balance+=h0.bet*2.5;B.log.push('Blackjack! Pays 3 to 2');return bjFinish()}
  B.phase='play';
  for(let i=0;i<B.hands.length;i++){
    const h=B.hands[i];B.active=i;
    if(h.cards.length===1){h.cards.push(draw());bjRender();sfx('card');await bw(360);if(B.hands.length>1)B.log.push(`Hand ${i+1}: ${h.cards.map(cs).join(' ')}`)}
    if(h.aceSplit){h.done=true;continue}
    while(!h.done){
      const v=hval(h.cards).t;
      if(v>21){h.done=true;h.result='bust';B.log.push(`${B.hands.length>1?'Hand '+(i+1)+' busts':'You bust'} with ${v}`);sfx('lose');bjRender();await bw(500);break}
      if(v===21){h.done=true;bjRender();await bw(300);break}
      const a=await new Promise(r=>{B.resolve=r;bjRender()});
      if(a==='hit'){h.cards.push(draw());B.log.push(`Hit → ${cs(h.cards[h.cards.length-1])} (${hval(h.cards).t})`);sfx('card');bjRender();await bw(360)}
      else if(a==='stand'){h.done=true;B.log.push(`Stand on ${v}`);sfx('check');bjRender()}
      else if(a==='double'){B.balance-=h.bet;h.bet*=2;h.doubled=true;sfx('chip');h.cards.push(draw());
        B.log.push(`Double down → ${cs(h.cards[h.cards.length-1])} (${hval(h.cards).t})`);bjRender();sfx('card');await bw(520);
        if(hval(h.cards).t>21){h.result='bust';sfx('lose');bjRender();await bw(350)}h.done=true}
      else if(a==='split'){B.balance-=h.bet;const nh={cards:[h.cards.pop()],bet:h.bet,split:true};h.split=true;
        if(h.cards[0].r===14){h.aceSplit=true;nh.aceSplit=true}
        B.hands.splice(i+1,0,nh);B.log.push(`Split ${rn(h.cards[0].r)}s`);sfx('chip');bjRender();await bw(320);
        h.cards.push(draw());bjRender();sfx('card');await bw(360);if(h.aceSplit)h.done=true}
      else if(a==='surrender'){h.done=true;h.result='surrender';B.balance+=h.bet/2;B.log.push('Surrender — half the bet returned');sfx('fold');bjRender()}
    }
  }
  B.phase='dealer';B.active=-1;
  await revealHole();
  if(B.hands.some(h=>!h.result)){
    for(;;){const{t,soft}=hval(B.dealer);if(t<17||(t===17&&soft&&B.set.s17==='hit')){B.dealer.push(draw());bjRender();sfx('card');await bw(560)}else break}
  }
  const d=hval(B.dealer).t;B.log.push(`Dealer: ${B.dealer.map(cs).join(' ')} (${d>21?'bust':d})`);
  for(const h of B.hands){if(h.result)continue;const p=hval(h.cards).t;
    if(d>21||p>d){h.result='win';B.balance+=h.bet*2}else if(p===d){h.result='push';B.balance+=h.bet}else h.result='lose'}
  return bjFinish();
}
async function revealHole(){if(B.holeUp)return;B.holeUp=true;B.rc+=hiLo(B.dealer[1]);bjRender();sfx('card');await bw(700)}
function bjFly(fromEl,toEl,n=6){
  const tb=$('#table').getBoundingClientRect(),a=center(fromEl),b=center(toEl);
  for(let k=0;k<n;k++){const dn=DEN[k%5],el=document.createElement('div');el.className='fly';
    el.style.left=(a.x-tb.left-11+(Math.random()*16-8))+'px';el.style.top=(a.y-tb.top-6+(Math.random()*8-4))+'px';
    el.innerHTML=`<div class="chip top" style="--c:${dn[1]};--e:${dn[2]}"></div>`;$('#table').appendChild(el);
    setTimeout(()=>{el.style.transform=`translate(${b.x-a.x}px,${b.y-a.y}px)`;el.style.opacity=.2},40+k*55);setTimeout(()=>el.remove(),900+k*55)}
  setTimeout(()=>sfx('chip'),300);
}
async function bjFinish(dealerBJ){
  B.phase='done';B.active=-1;
  const net=B.balance-B.roundStart,s=B.stats,dt=hval(B.dealer).t;
  for(const h of B.hands){
    if(h.result==='win'||h.result==='bj'){s.won++;if(h.result==='bj')s.bj++;if(h.doubled)s.doubles++;bjFly($('#tray'),$('#betCircle'),5)}
    else if(h.result==='push')s.push++;
    else{s.lost++;if(h.result!=='surrender')bjFly($('#betCircle'),$('#tray'),4)}
  }
  if(net>0){s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak);s.biggest=Math.max(s.biggest,net)}else if(net<0)s.streak=0;
  const any=r=>B.hands.some(h=>h.result===r),all=r=>B.hands.every(h=>h.result===r);
  let big,sub=net>0?`+${fmtB(net)}`:net<0?fmtB(net):'Bet returned';
  if(any('bj')){big='Blackjack!';sfx('win');confetti(110)}
  else if(dealerBJ){big='Dealer Blackjack';sfx('lose')}
  else if(net>0){big=dt>21?'Dealer Busts':'You Win';sfx('win');if(net>=B.lastBet*2)confetti(70)}
  else if(net===0){big='Push';sfx('check')}
  else if(all('bust')){big='Bust';sfx('lose')}
  else if(all('surrender')){big='Surrender'}
  else{big='Dealer Wins';sfx('lose')}
  showBanner(big,sub);
  B.msg='';
  B.log.push(net>0?`Won ${fmtB(net)}`:net<0?`Lost ${fmtB(-net)}`:'Push');
  bjRender();saveBJ();
  await bw(2300);
  $('#bj').classList.add('clearing');sfx('card');await bw(480);
  B.dealer=[];B.hands=[];B.holeUp=false;bjAnim.clear();bjRender();$('#bj').classList.remove('clearing');
  B.lastLog=B.log.slice();
  if(B.shoe.length<=B.cut){B.msg='Shuffling a fresh shoe…';bjRender();$('#shoe').classList.add('shuffle');sfx('card');await bw(600);sfx('card');await bw(600);
    newShoe();$('#shoe').classList.remove('shuffle');B.lastLog.push('— New shoe shuffled');}
  B.msg='';
  bjToBet();
}
function bjGameOver(){
  ovMode='bjbust';clearBJ();
  $('#setup').classList.add('hidden');
  $('#ovTitle').textContent='OUT OF CHIPS';
  $('#ovText').textContent=`You played ${B.stats.hands} hands and won ${B.stats.won}. Want back in?`;
  $('#ovBtn').querySelector('span').textContent=`Rebuy ${fmtB(+B.set.stack)}`;
  $('#ovAlt').classList.remove('hidden');$('#ovAlt').querySelector('span').textContent='Main Menu';
  $('#overlay').classList.remove('hidden');sfx('lose');
}

/* ---------- strategy coach ---------- */
function bjCan(h){
  const two=h&&h.cards.length===2&&!h.done;
  return{
    d:!!(two&&B.balance>=h.bet&&!h.aceSplit),
    p:!!(two&&cval(h.cards[0])===cval(h.cards[1])&&B.hands.length<4&&B.balance>=h.bet&&!h.aceSplit),
    r:!!(two&&B.hands.length===1&&!h.split)};
}
function bjStrategy(h,up){
  const u=cval(up),{t,soft}=hval(h.cards),c=bjCan(h),h17=B.set.s17==='hit';
  const D=c.d?'Double':'Hit',S='Stand',H='Hit';
  if(c.p){const r=cval(h.cards[0]);
    const sp={11:true,8:true,10:false,9:![7,10,11].includes(u),7:u<=7,6:u<=6,5:false,4:u===5||u===6,3:u<=7,2:u<=7}[r];
    if(sp)return'Split';}
  if(soft&&t<21){
    if(t>=20)return S;
    if(t===19)return u===6&&h17&&c.d?'Double':S;
    if(t===18){if((u>=3&&u<=6)||(u===2&&h17))return c.d?'Double':S;if(u<=8)return S;return H}
    if(t===17)return u>=3&&u<=6?D:H;
    if(t===15||t===16)return u>=4&&u<=6?D:H;
    if(t===13||t===14)return u>=5&&u<=6?D:H;
    return H;
  }
  if(c.r){if(t===16&&u>=9)return'Surrender';if(t===15&&u===10)return'Surrender'}
  if(t>=17)return S;if(t>=13)return u<=6?S:H;if(t===12)return u>=4&&u<=6?S:H;
  if(t===11)return D;if(t===10)return u<=9?D:H;if(t===9)return u>=3&&u<=6?D:H;return H;
}
const trueCount=()=>B.rc/Math.max(.5,B.shoe.length/52);

/* ---------- rendering ---------- */
function bjCardHTML(c,key,faceUp,extra=''){
  const kb=key+'b',kf=key+'f';
  if(!faceUp){let a='';if(!bjAnim.has(kb)){bjAnim.add(kb);a=' anim-deal'}return backHTML(a)}
  if(bjAnim.has(kb)){let a='';if(!bjAnim.has(kf)){bjAnim.add(kf);a=' anim-flip'}return`<div class="card flipwrap${a}">${backHTML('')}${faceHTML(c,'')}</div>`}
  let a='';if(!bjAnim.has(kf)){bjAnim.add(kf);a=' anim-deal'}return faceHTML(c,a+extra);
}
function setHTML(el,h){const sig=h.replace(/ anim-(deal|flip)/g,'');if(el._h!==sig){el._h=sig;el.innerHTML=h}}
function totText(cards,bj){if(!cards.length)return'';if(bj)return'Blackjack';const{t,soft}=hval(cards);return soft&&t<21?`${t-10} / ${t}`:String(t)}
function resText(h){return{bj:'Blackjack!',win:`Win +${fmtB(h.bet)}`,lose:'Lose',push:'Push',bust:'Bust',surrender:'Surrender'}[h.result]||''}
function bjMoney(el,val){
  if(el._v===undefined||el._v===val){cancelAnimationFrame(el._raf);el._v=val;el._shown=val;el.textContent=fmtB(val);return}
  const from=el._shown,start=performance.now();el._v=val;cancelAnimationFrame(el._raf);
  const step=t=>{const k=Math.min(1,(t-start)/550),e=1-Math.pow(1-k,3),v=k<1?Math.round(from+(val-from)*e):val;el._shown=v;el.textContent=fmtB(v);if(k<1)el._raf=requestAnimationFrame(step)};
  el._raf=requestAnimationFrame(step);
}
function bjRender(){
  if(!B||mode!=='bj')return;
  const decks=+B.set.decks;
  $('#info').innerHTML=`<b>Blackjack</b> · ${decks} deck${decks>1?'s':''} · ${B.set.s17==='hit'?'H17':'S17'}<span class="nl"> · Round ${B.round}</span>`;
  setHTML($('#dCards'),B.dealer.map((c,k)=>bjCardHTML(c,'d'+k,k!==1||B.holeUp)).join(''));
  const vis=B.holeUp?B.dealer:B.dealer.slice(0,1),dt=$('#dTot'),dv=hval(vis).t;
  dt.textContent=B.dealer.length?'Dealer · '+totText(vis,B.holeUp&&isBJ(B.dealer)):'';
  dt.classList.toggle('on',B.dealer.length>0);dt.classList.toggle('bust',dv>21);
  const ph=$('#pHands');ph.classList.toggle('many',B.hands.length>2);
  setHTML(ph,B.hands.map((h,i)=>{
    const v=hval(h.cards).t,act=B.phase==='play'&&B.active===i&&B.hands.length>1,wait=B.phase==='play'&&B.hands.length>1&&i>B.active;
    const cards=h.cards.map((c,k)=>bjCardHTML(c,`h${i}-${k}`,true,h.doubled&&k===2?' side':'')).join('');
    return`<div class="hand${act?' active':''}${wait?' wait':''}${h.result==='lose'||h.result==='bust'?' lost':''}"><div class="bj-cards">${cards}</div>
      <div class="tot on${v>21?' bust':''}">${totText(h.cards,isBJ(h.cards,h.split))}</div>${B.hands.length>1||h.doubled?`<div class="hbet">${fmtB(h.bet)}${h.doubled?' · doubled':''}</div>`:''}
      ${h.result?`<div class="res ${h.result}">${resText(h)}</div>`:''}</div>`}).join(''));
  const wager=B.phase==='bet'?B.bet:B.hands.reduce((a,h)=>a+h.bet,0)+B.insurance;
  const cc=$('#circleChips'),ch=wager>0?chipsHTML(Math.floor(wager),3):'';if(cc._h!==ch){cc._h=ch;cc.innerHTML=ch}
  $('#betAmt').textContent=wager>0?fmtB(wager):'';$('#betAmt').classList.toggle('on',wager>0);
  $('#betCircle').classList.toggle('glow',B.phase==='bet');
  bjMoney($('#bjBal'),B.balance-(B.phase==='bet'?B.bet:0));
  const used=1-B.shoe.length/B.total;
  $('#shoeLeft').textContent=`${B.shoe.length} cards`;$('#discard').style.setProperty('--h',Math.round(used*86)+'%');
  $('#bjMsg').textContent=B.msg;
  // controls
  const p=B.phase,live=!!B.resolve,h=B.hands[B.active],can=bjCan(h);
  $('#bjBetRow').classList.toggle('hidden',p!=='bet');$('#bjBetBtns').classList.toggle('hidden',p!=='bet');
  $('#bjPlayRow').classList.toggle('hidden',p==='bet'||p==='insurance');
  $('#bjInsRow').classList.toggle('hidden',p!=='insurance');
  $('#bjMiniRow').classList.toggle('hidden',!(p==='play'&&live&&can.r));
  document.querySelectorAll('.chipbtn').forEach(b=>b.disabled=p!=='bet'||B.bet+ +b.dataset.v>B.balance);
  $('#bjDealBtn').disabled=p!=='bet'||B.bet<5;$('#bjClear').disabled=p!=='bet'||!B.bet;$('#bjX2').disabled=p!=='bet'||!B.bet||B.bet*2>B.balance;
  const pl=p==='play'&&live&&h;
  $('#bjHit').disabled=!pl;$('#bjStand').disabled=!pl;$('#bjDouble').disabled=!(pl&&can.d);$('#bjSplit').disabled=!(pl&&can.p);
  if(p==='insurance')$('#bjInsYes').querySelector('span').textContent=`Yes · ${fmtB(B.hands[0].bet/2)}`;
  const tc=trueCount();let st='';
  if(p==='bet')st=B.bet?`Bet ${fmtB(B.bet)} — tap Deal`:'Tap chips to place your bet';
  else if(p==='insurance')st=coach?`💡 ${tc>=3?'Take it — the count is high':'Decline — insurance is a bad bet'}`:'Dealer shows an Ace';
  else if(pl)st=coach?`💡 ${bjStrategy(h,B.dealer[0])}`:(B.hands.length>1?`Hand ${B.active+1} of ${B.hands.length} — your move`:'Your move');
  $('#bjStatus').textContent=st;$('#bjStatus').classList.toggle('you',!!(pl||p==='insurance'));
  const cn=$('#bjCount');cn.classList.toggle('off',!coach);cn.innerHTML=`Count <b>${B.rc>0?'+':''}${B.rc}</b> · True <b>${tc>0?'+':''}${tc.toFixed(1)}</b>`;
  // deal origin
  const so=center($('#shoe'));
  document.querySelectorAll('#bj .anim-deal:not([data-o])').forEach(el=>{const c=center(el);el.dataset.o=1;el.style.setProperty('--fx',(so.x-c.x)+'px');el.style.setProperty('--fy',(so.y-c.y)+'px')});
}

/* ---------- controls ---------- */
const bjSend=a=>{if(B&&B.resolve){const r=B.resolve;B.resolve=null;r(a)}};
document.querySelectorAll('.chipbtn').forEach(b=>b.addEventListener('click',()=>{if(!B||B.phase!=='bet')return;const v=+b.dataset.v;
  if(B.bet+v<=B.balance){B.bet+=v;sfx('chip');B.msg='';bjRender()}}));
$('#bjClear').onclick=()=>{if(B&&B.phase==='bet'){B.bet=0;sfx('check');bjRender()}};
$('#bjX2').onclick=()=>{if(B&&B.phase==='bet'&&B.bet*2<=B.balance){B.bet*=2;sfx('chip');bjRender()}};
$('#bjDealBtn').onclick=()=>bjRound();
$('#bjHit').onclick=()=>bjSend('hit');$('#bjStand').onclick=()=>bjSend('stand');
$('#bjDouble').onclick=()=>bjSend('double');$('#bjSplit').onclick=()=>bjSend('split');$('#bjSurr').onclick=()=>bjSend('surrender');
$('#bjInsYes').onclick=()=>bjSend('yes');$('#bjInsNo').onclick=()=>bjSend('no');
document.addEventListener('keydown',e=>{
  if(mode!=='bj'||!B||document.querySelector('#overlay:not(.hidden),#custom:not(.hidden),#statsPanel:not(.hidden)'))return;
  const k=e.key.toLowerCase();
  if(B.phase==='bet'&&(k==='enter'||k===' ')){e.preventDefault();bjRound();return}
  if(B.phase==='insurance'){if(k==='y')bjSend('yes');if(k==='n')bjSend('no');return}
  const btn={h:'#bjHit',s:'#bjStand',d:'#bjDouble',p:'#bjSplit',r:'#bjSurr'}[k];
  if(btn&&!$(btn).disabled&&!$(btn).closest('.hidden'))$(btn).click();
});

/* ---------- stats ---------- */
function bjOpenStats(){
  const s=B?B.stats:bjNewStats(+settings.stack||1000),pc=(a,b)=>b?Math.round(a/b*100)+'%':'—';
  const inPlay=B&&B.phase!=='bet'?B.hands.reduce((a,h)=>a+h.bet,0)+B.insurance:0;
  const net=B?B.balance+inPlay-s.start*(1+s.rebuys):0;
  const tiles=[['Hands',s.hands],['Won',`${s.won} <small>${pc(s.won,s.won+s.lost)}</small>`],['Net',`<span class="${net>=0?'pos':'neg'}">${net>=0?'+':'−'}${fmtB(Math.abs(net))}</span>`],
    ['Blackjacks',s.bj],['Pushes',s.push],['Lost',s.lost],['Biggest win',s.biggest?fmtB(s.biggest):'—'],['Best streak',s.bestStreak],['Rebuys',s.rebuys]];
  $('#statGrid').innerHTML=tiles.map(([k,v])=>`<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');
  const log=B?(B.phase==='bet'?B.lastLog:B.log):[];
  $('#histTitle').textContent=B&&B.phase!=='bet'?'This round':'Last round';
  $('#hist').innerHTML=log.length?log.map(l=>`<div class="${/^(Round|—)/.test(l)?'st':/^Won|Blackjack!/.test(l)?'w':''}">${l}</div>`).join(''):'<div>No rounds yet.</div>';
  $('#statsPanel').classList.remove('hidden');
}

P=PROFILES.map((pr,i)=>({id:i,name:pr.name,isHuman:i===0,chips:1000,hand:[],bet:0,total:0,lastAction:'',rangeT:0}));
